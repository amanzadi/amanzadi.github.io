name: Update publications

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install -r requirements.txt
      - run: python sync_publications.py
      - run: python build.py
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update publication metadata"
          title: "Update publication metadata"
          body: "Automated monthly/manual publication metadata refresh from ORCID and DOI records. Please review new or changed entries before merging."
          branch: automation/update-publications
          delete-branch: true
